{% extends "base.html" %}{% block title %}Подтверждение · Правбюро{% endblock %}
{% block content %}<section class="auth-card card"><h1>Подтвердите почту</h1><p>Введите шестизначный код из письма.</p>
{% if info %}<p>{{ info }}</p>{% endif %}{% if error %}<div class="alert">{{ error }}</div>{% endif %}<form method="post" action="/register/confirm">
<input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Код<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
<button class="button">Подтвердить</button></form></section>{% endblock %}
