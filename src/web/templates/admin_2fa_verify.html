{% extends "base.html" %}
{% block title %}Код подтверждения · Правбюро{% endblock %}
{% block content %}
<section class="auth-card card"><p class="eyebrow">Администратор</p><h1>Введите код из приложения</h1>
<p>Откройте приложение-аутентификатор и введите текущий шестизначный код.</p>
{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post" action="/admin/2fa/verify"><input type="hidden" name="csrf" value="{{ csrf_token }}">
<label>Код из приложения<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" autofocus></label>
<button class="button" type="submit">Войти</button></form></section>
{% endblock %}
