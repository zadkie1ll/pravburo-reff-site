{% extends "base.html" %}{% block title %}Новый пароль · Правбюро{% endblock %}
{% block content %}<section class="auth-card card"><h1>Новый пароль</h1>{% if info %}<p>{{ info }}</p>{% endif %}{% if error %}<div class="alert">{{ error }}</div>{% endif %}
<form method="post" action="/password/reset/confirm"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Код<input name="code" maxlength="6" required></label><label>Новый пароль<input type="password" name="password" minlength="6" required></label><label>Повторите пароль<input type="password" name="password_repeat" minlength="6" required></label><button class="button">Сохранить</button></form></section>{% endblock %}
